[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --disable-socket --allow-unix-socket"

[tool.coverage.run]
source = ["custom_components.virtual_ir_remote"]

[tool.coverage.report]
show_missing = true
