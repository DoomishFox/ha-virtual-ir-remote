[project]
name = "ha-virtual-ir-remote"
version = "1.0.0"
description = "Home Assistant virtual remotes backed by MQTT infrared emitters."
readme = "README.md"
requires-python = ">=3.14.2"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "DoomishFox" }]

[project.urls]
Homepage = "https://github.com/DoomishFox/ha-virtual-ir-remote"
Issues = "https://github.com/DoomishFox/ha-virtual-ir-remote/issues"

[dependency-groups]
test = [
    "pytest-homeassistant-custom-component==0.13.366",
    "infrared-protocols==9.0.0",
]
lint = ["ruff>=0.15,<1"]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[tool.uv]
# HACS installs custom_components directly; there is no Python distribution to build.
package = false

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-config",
    "--strict-markers",
    "--disable-socket",
    "--allow-unix-socket",
    "-ra",
]

[tool.coverage.run]
branch = true
source = ["custom_components.virtual_ir_remote"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [".foxenv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
